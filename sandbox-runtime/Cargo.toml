[package]
name = "sandbox-runtime"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "MIT"
publish = false

[lib]
name = "sandbox_runtime"
path = "src/lib.rs"

# Binaries live in src/bins/, not src/bin/: the repo's .dockerignore drops every **/bin, which is
# the .NET output directory, and the sandbox image builds this crate from the build context.
[[bin]]
name = "sandbox-launcher"
path = "src/bins/sandbox-launcher.rs"

[[bin]]
name = "vfs-daemon"
path = "src/bins/vfs-daemon.rs"

[[bin]]
name = "vfs-action"
path = "src/bins/vfs-action.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
# Pure Rust, no libfuse: the daemon mounts as root with the mount syscall itself.
fuser = { version = "0.18", default-features = false }
# No TLS: the bridge is plain HTTP on the deployment's own network, and no TLS stack keeps the
# static binary small.
ureq = { version = "3", default-features = false }

[profile.release]
opt-level = 2
lto = "thin"
strip = true
panic = "abort"
