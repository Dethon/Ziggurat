# The tenant kit beside a smoke stack on this same machine (scripts/smoke-stack.sh), run as project
# tenant-kit-smoke so a real kit here is never touched. Its servers tunnel to the smoke stack's relay
# as they would to the deployment's: by the deployment's main host, which here is this machine's own
# Caddy (host-gateway, where its 443 is published), trusting Caddy's local CA, whose root the script
# copies out beside the smoke state before the kit starts. Every piece of the kit's state starts empty
# under the smoke stack's ./volumes/smoke, which the script's down removes. The script starts web
# search with its browser, the vault, the library, the sandbox and the printer, and the kit's Redis:
# never Home Assistant's server, Home Assistant or Music Assistant, which reach the home and the LAN,
# nor qBittorrent and Jackett. Voice starts only for `scripts/smoke-stack.sh voice` (profile voice),
# talking to a test satellite (TenantKit/smoke/satellite.py) and never to the home's: the shipped
# catalogue's satellite is left with no address, so nothing dials it. The printer prints to a stand-in on the kit's own
# network (smoke-printer: CUPS's ippeveprinter, which takes a job and keeps it as a file), never to the
# site's printer.
x-hub-here: &hub-here
  extra_hosts:
    - "${DEPLOYMENT_HOST}:host-gateway"

x-hub-ca: &hub-ca ../DockerCompose/volumes/smoke/kit/hub-ca.crt:/smoke/hub-ca.crt:ro

x-hub-ca-env: &hub-ca-env
  MCP__TUNNEL__HUBCERTIFICATEAUTHORITY: /smoke/hub-ca.crt

services:
  redis:
    volumes: ["../DockerCompose/volumes/smoke/kit/redis:/data"]

  mcp-websearch:
    <<: *hub-here
    volumes: [*hub-ca]
    environment: *hub-ca-env

  mcp-vault:
    <<: *hub-here
    volumes:
      - *hub-ca
      - "../DockerCompose/volumes/smoke/kit/vault:/vault"
    environment: *hub-ca-env

  mcp-library:
    <<: *hub-here
    volumes:
      - *hub-ca
      - "../DockerCompose/volumes/smoke/kit/media:/media"
    environment: *hub-ca-env

  mcp-sandbox:
    <<: *hub-here
    volumes:
      - *hub-ca
      - "../DockerCompose/volumes/smoke/kit/sandbox:/home/sandbox_user"
    environment: *hub-ca-env

  mcp-printer:
    <<: *hub-here
    volumes: [*hub-ca]
    environment:
      <<: *hub-ca-env
      PRINTERURI: ipp://smoke-printer.local:8631/ipp/print
      # The stand-in cannot type an octet-stream text job as a real printer does, so the smoke kit
      # names its documents text; it prints text alone.
      DOCUMENTFORMAT: text/plain

  # A second household's own vault, beside the home's: the smoke test that onboards a household mints
  # its vault credential through the admin API and starts this with it (`scripts/smoke-stack.sh
  # household-vault`, the credential in SMOKE_HOUSEHOLD_VAULT_CREDENTIAL), so the household's agent
  # reads its own notes through its own tunnel, under the same server name as the home's. Its folder
  # is its own; `down` removes it with the rest.
  mcp-vault-household:
    profiles: [household]
    image: mcp-vault:latest
    user: ${PUID:-1654}:${PGID:-1654}
    <<: *hub-here
    volumes:
      - *hub-ca
      - "../DockerCompose/volumes/smoke/kit/household-vault:/vault"
    environment:
      <<: *hub-ca-env
      TZ: Europe/Madrid
      MCP__TUNNEL__HUB: wss://${DEPLOYMENT_HOST}/tunnel
      MCP__TUNNEL__SERVERNAME: vault
      MCP__TUNNEL__CREDENTIAL: ${SMOKE_HOUSEHOLD_VAULT_CREDENTIAL:-}
    networks: [kit]

  # A printer that prints nothing: it answers IPP as a printer does and keeps each job under /jobs.
  # It refuses a request whose Host is not its own name, which beside its DNS-SD daemon is
  # <hostname>.local, so it is reached by that alias.
  # ippeveprinter will not start without a DNS-SD daemon even told to advertise nothing (-r off), so
  # one runs beside it, on the kit's bridge network alone.
  smoke-printer:
    hostname: smoke-printer
    build:
      dockerfile_inline: |
        FROM debian:bookworm-slim
        RUN apt-get update && apt-get install -y --no-install-recommends cups-ipp-utils avahi-daemon dbus \
            && rm -rf /var/lib/apt/lists/* && mkdir -p /jobs /run/dbus
    entrypoint: ["sh", "-c", "dbus-daemon --system && avahi-daemon -D --no-chroot && sleep 1 && exec ippeveprinter -p 8631 -r off -k -d /jobs -f text/plain,image/jpeg,image/pwg-raster,image/urf,application/vnd.hp-pcl,application/octet-stream 'Smoke Printer'"]
    networks:
      kit:
        aliases: [smoke-printer.local]

  # The smoke stack never runs Home Assistant, and the kit's server for it waits on voice, which runs
  # only under the voice profile: held back by a profile of its own, or compose refuses the whole kit.
  mcp-homeassistant:
    profiles: [home]

  mcp-channel-voice:
    profiles: [voice]
    <<: *hub-here
    volumes:
      - *hub-ca
      - "../DockerCompose/volumes/smoke/kit/voices:/voices"
      - "../DockerCompose/volumes/smoke/kit/tse-audit:/tse-audit"
    environment:
      <<: *hub-ca-env
      # The shipped catalogue's satellite is a device on the home's LAN: no address, never dialled.
      Satellites__fran-office-01__Address: ""
      Satellites__smoke-satellite__Address: tcp://test-satellite:10800
      Satellites__smoke-satellite__Identity: household
      Satellites__smoke-satellite__Room: Smoke room
      Satellites__smoke-satellite__WakeWord: ok_nabu

  # A satellite that speaks the questions in its folder and records what the hub answers.
  test-satellite:
    profiles: [voice]
    image: python:3.12-alpine
    command: ["python", "-u", "/satellite/satellite.py"]
    environment:
      LINGER: "${SATELLITE_LINGER:-100}"
    volumes:
      - "./smoke:/satellite:ro"
      - "../DockerCompose/volumes/smoke/kit/satellite:/voice"
    networks: [kit]
