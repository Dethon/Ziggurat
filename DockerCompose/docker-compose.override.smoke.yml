# A smoke stack on somebody's own machine (scripts/smoke-stack.sh): every piece of state starts empty
# under ./volumes/smoke, so a stale copy of the deployment's data in ./volumes is never loaded — its
# schedules would fire — and Caddy serves the shipped Caddyfile through its own local CA instead of
# Cloudflare's DNS challenge. The script starts only the servers that reach nothing outside this
# machine: no Telegram bot. A household's own servers are the tenant kit's, not this file's: the
# script starts the kit beside this stack (TenantKit/docker-compose.override.smoke.yml).
services:
  # Where the smoke tests stand to call a server from inside the deployment's network, past Caddy, as
  # anything on it could: curl and nothing else, beside every server and app. Nothing ships it.
  smoke-probe:
    image: curlimages/curl:8.11.1
    container_name: smoke-probe
    entrypoint: ["sh", "-c", "trap 'exit 0' TERM; while :; do sleep 3600 & wait $$!; done"]
    restart: "no"
    networks:
      - jackbot

  # What the accounts service's key probes ask instead of OpenRouter, Idealista and Telegram: every
  # path answered 200, so every key an owner saves here is working, and no key is ever sent to a
  # provider to be checked. What a key buys in a turn is the provider's: the agent's model calls
  # still go to OpenRouter. Nothing ships it.
  smoke-keys:
    image: caddy:2.11.7-alpine
    container_name: smoke-keys
    command: ["caddy", "respond", "--listen", ":8080", "--body", "{}"]
    restart: "no"
    networks:
      - jackbot

  redis:
    volumes: ["./volumes/smoke/redis:/data"]
  accounts-volume:
    volumes: ["./volumes/smoke/accounts:/data"]
  accounts:
    volumes: ["./volumes/smoke/accounts:/data"]
    environment:
      KEYPROBES__OPENROUTERURL: http://smoke-keys:8080/
      KEYPROBES__IDEALISTAURL: http://smoke-keys:8080/
      KEYPROBES__TELEGRAMURL: http://smoke-keys:8080/
  mcp-sugary-volume:
    volumes: ["./volumes/smoke/sugary:/data"]
  mcp-sugary:
    volumes: ["./volumes/smoke/sugary:/data"]
  agent-volume:
    volumes: ["./volumes/smoke/agent-keys:/keys"]
  agent:
    volumes: ["./volumes/smoke/agent-keys:/keys"]
  household-migration:
    volumes:
      - "./volumes/smoke/household-migration:/input"
      - "./volumes/smoke/sugary:/sugary"
      - "./volumes/smoke/voices:/voices"
  caddy:
    environment:
      CADDY_TLS: internal
    volumes:
      - "./volumes/smoke/caddy_data:/data"
      - "./volumes/smoke/caddy_config:/config"
