name: jackbot

# Single source of truth for the agent's operating timezone (applied to the two
# containers that surface time to the LLM / fire schedules).
x-timezone: &timezone
  TZ: Europe/Madrid

# One name for the STT model on every side at once: the lemonade entrypoint pre-pulls it, and the
# voice hub and both chat channels request it. The four must agree or the model that decodes is
# not the model that was warmed, and every transcription pays for a lazy pull of a second one.
x-stt-model: &stt-model ${STT_MODEL:-Whisper-Large-v3-Turbo}

# The browser origins the agent's registration API and the hub answer with a visitor's
# credentials: the deployment's own hosts, the ones the Caddyfile serves them on. Per deployment,
# and one list for both so they cannot disagree; a page on any other origin gets no CORS headers.
# Add a host as __2, __3 ...; with none at all both are same-origin only.
x-cors-origins: &cors-origins
  CORS__ALLOWEDORIGINS__0: https://assistants.herfluffness.com
  CORS__ALLOWEDORIGINS__1: https://sexy.herfluffness.com

services:
  redis:
    image: redis/redis-stack-server:latest
    logging:
      options:
        max-size: "5m"
        max-file: "3"
    container_name: redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./volumes/redis_data:/data
    environment:
      <<: *timezone
      REDIS_ARGS: "--appendonly yes --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"
      # redis-cli reads it, so the health check below authenticates without the password in
      # its command line.
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - jackbot

  qbittorrent:
    image: qbittorrentofficial/qbittorrent-nox:latest
    logging:
      options:
        max-size: "5m"
        max-file: "3"
    container_name: qbittorrent
    ports:
      - "${LAN_BIND_ADDRESS:-127.0.0.1}:8001:8001"
      - "${LAN_BIND_ADDRESS:-127.0.0.1}:6881:6881/tcp"
      - "${LAN_BIND_ADDRESS:-127.0.0.1}:6881:6881/udp"
    volumes:
      - ./volumes/qbittorrent_config:/config
      - ${DATA_PATH:-./volumes/data}/downloads:/downloads
    environment:
      <<: *timezone
      PUID: ${PUID:-1654}
      PGID: ${PGID:-1654}
      QBT_LEGAL_NOTICE: confirm
      QBT_VERSION: 5.1.2-2
      QBT_TORRENTING_PORT: 6881
      QBT_WEBUI_PORT: 8001
      UMASK: "002"
    stop_grace_period: 30m
    restart: unless-stopped
    networks:
      - jackbot

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    logging:
      options:
        max-size: "5m"
        max-file: "3"
    container_name: homeassistant
    ports:
      - "${LAN_BIND_ADDRESS:-127.0.0.1}:8123:8123"
    volumes:
      - ./volumes/homeassistant_config:/config
    environment:
      <<: *timezone
    restart: unless-stopped
    networks:
      - jackbot

  music-assistant:
    image: ghcr.io/music-assistant/server:latest
    logging:
      options:
        max-size: "5m"
        max-file: "3"
    container_name: music-assistant
    # host networking is required for mDNS/zeroconf discovery (Spotify Connect,
    # AirPlay, Chromecast). Binds directly on the host: 8095 (web UI + API),
    # 1704/1705/1780 (snapcast), 8097 (stream server).
    network_mode: host
    volumes:
      - ./volumes/music-assistant-data:/data
    environment:
      <<: *timezone
    restart: unless-stopped

  filebrowser:
    image: filebrowser/filebrowser:v2
    logging:
      options:
        max-size: "5m"
        max-file: "3"
    container_name: filebrowser
    user: ${PUID:-1654}:${PGID:-1654}
    ports:
      - "${LAN_BIND_ADDRESS:-127.0.0.1}:8002:80"
    volumes:
      - ${DATA_PATH:-./volumes/data}:/srv
      - ./volumes/filebrowser_database:/database
      - ./volumes/filebrowser_config:/config
    environment:
      <<: *timezone
    restart: unless-stopped
    networks:
      - jackbot

  jackett:
    image: lscr.io/linuxserver/jackett:latest
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
    container_name: jackett
    ports:
      - "${LAN_BIND_ADDRESS:-127.0.0.1}:8003:9117"
    volumes:
      - ./volumes/jackett_config:/config
      - ./volumes/jackett_data/downloads:/downloads
    environment:
      <<: *timezone
      PUID: ${PUID:-1654}
      PGID: ${PGID:-1654}
      UMASK: "022"
    restart: unless-stopped
    networks:
      - jackbot
  #    depends_on:
  #      - flaresolverr

  #  flaresolverr:
  #    image: ghcr.io/flaresolverr/flaresolverr:latest
  #    logging:
  #      options:
  #        max-size: "5m"
  #        max-file: "3"
  #    container_name: flaresolverr
  #    environment:
  #      - LOG_LEVEL=info
  #      - LOG_HTML=false
  #      - CAPTCHA_SOLVER=none
  #    ports:
  #      - "8191:8191"
  #    networks:
  #      - jackbot
  #    restart: unless-stopped

  plex:
    image: lscr.io/linuxserver/plex:latest
    logging:
      options:
        max-size: "5m"
        max-file: "3"
    container_name: plex
    network_mode: host
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ./volumes/plex_config:/config
      - ${DATA_PATH:-./volumes/data}:/media
    environment:
      <<: *timezone
      PUID: ${PUID:-1654}
      PGID: ${PGID:-1654}
      VERSION: docker
    restart: unless-stopped

  base-sdk:
    image: base-sdk:latest
    build:
      context: ${REPOSITORY_PATH}
      dockerfile: Dockerfile.base-sdk
      labels:
        keep: "true"
    entrypoint: ["true"]
    environment:
      <<: *timezone
    restart: "no"
    networks:
      - jackbot

  mcp-library:
    image: mcp-library:latest
    logging:
      options:
        max-size: "5m"
        max-file: "3"
    container_name: mcp-library
    build:
      context: ${REPOSITORY_PATH}
      dockerfile: McpServerLibrary/Dockerfile
    user: ${PUID:-1654}:${PGID:-1654}
    volumes:
      - ${DATA_PATH:-./volumes/data}:/media
    restart: unless-stopped
    environment:
      # The secrets this service reads, by name: it is never handed the whole .env.
      JACKETT__APIKEY: ${JACKETT__APIKEY}
      QBITTORRENT__USERNAME: ${QBITTORRENT__USERNAME}
      QBITTORRENT__PASSWORD: ${QBITTORRENT__PASSWORD}
      <<: *timezone
      REDISCONNECTIONSTRING: redis:6379,password=${REDIS_PASSWORD}
      MCP__SHAREDSECRET: ${MCP_SECRET_LIBRARY}
    networks:
      - jackbot
    depends_on:
      qbittorrent:
        condition: service_started
      jackett:
        condition: service_started
      base-sdk:
        condition: service_started
      redis:
        condition: service_healthy

  mcp-vault:
    image: mcp-vault:latest
    logging:
      options:
        max-size: "5m"
        max-file: "3"
    container_name: mcp-vault
    build:
      context: ${REPOSITORY_PATH}
      dockerfile: McpServerVault/Dockerfile
    user: ${PUID:-1654}:${PGID:-1654}
    volumes:
      - ${VAULT_PATH:-./volumes/vault}:/vault
    restart: unless-stopped
    environment:
      <<: *timezone
      MCP__SHAREDSECRET: ${MCP_SECRET_VAULT}
    networks:
      - jackbot
    depends_on:
      - base-sdk

  mcp-sandbox:
    image: mcp-sandbox:latest
    logging:
      options:
        max-size: "5m"
        max-file: "3"
    container_name: mcp-sandbox
    build:
      context: ${REPOSITORY_PATH}
      dockerfile: McpServerSandbox/Dockerfile
    # No `user:` — the image's entrypoint is a root launcher (sandbox-runtime/) that starts the MCP
    # server as a uid of its own and runs every command as PUID:PGID, its bounding set dropped. It
    # needs SYS_ADMIN for the per-command mount namespace and the FUSE mount of the session's other
    # mounts at /vfs (with /dev/fuse below); commands never hold it.
    cap_add:
      - SYS_ADMIN
    # docker-default denies every mount, so on an AppArmor host (prod) every exec would fail; this
    # profile allows only the launcher's own. Install it on the host before `up` — see its header.
    # Docker's own syscall filter grants a SYS_ADMIN container bpf, perf_event_open, setns and more;
    # ours is Docker's default with that cut to mount, umount2 and unshare(CLONE_NEWNS).
    security_opt:
      - apparmor=ziggurat-sandbox
      - seccomp=./seccomp/ziggurat-sandbox.json
    # Only /dev/dri, same as lemonade: the render node alone keeps this up on hosts with no
    # /dev/kfd (Intel iGPU, Raspberry Pi). An AMD host that wants ROCm/HIP inside the sandbox
    # adds the compute node via docker-compose.override.rocm.yml.
    devices:
      - /dev/dri:/dev/dri
      - /dev/fuse:/dev/fuse
    # /dev/dri/renderD* is root:render 0660 and --device preserves host ownership, so PUID
    # needs render as a supplementary GID or every open is EACCES and whatever the agent
    # installed silently falls back to CPU. Set RENDER_GID from the target host:
    # getent group render | cut -d: -f3
    group_add:
      - "${RENDER_GID:-993}"
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    volumes:
      - ${SANDBOX_HOME_PATH:-./volumes/sandbox}:/home/sandbox_user
    restart: unless-stopped
    # No env_file: this container runs whatever the model writes, so it is handed the one secret it
    # needs by name rather than the deployment's whole secrets file. Commands get none of it either
    # way — the launcher gives them a minimal environment, and the server runs as a uid they cannot
    # inspect.
    environment:
      <<: *timezone
      MCP__SHAREDSECRET: ${MCP_SECRET_SANDBOX}
      HOME: /home/sandbox_user
      PATH: /home/sandbox_user/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      PUID: ${PUID:-1654}
      PGID: ${PGID:-1654}
      # Where a command's file operations on the other mounts are answered: the agent's exec
      # bridge, on the sandbox network only (the proxy never routes it).
      VFSBRIDGEURL: http://agent:8080/api/vfs-bridge
    # A network of its own, shared with the agent alone: the agent dials its /mcp and it calls the
    # agent's exec bridge back. The servers behind the proxy believe the identity headers it copies
    # on because only the proxy reaches them, and a command written by the model must not reach them
    # with headers of its own. Not internal: commands still reach the internet.
    networks:
      - sandbox
    depends_on:
      - base-sdk

  camoufox:
    image: camoufox:latest
    build:
      context: ./camoufox
    logging:
      options:
        max-size: "5m"
        max-file: "3"
    container_name: camoufox
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9377/json"]
      interval: 10s
      timeout: 5s
      retries: 3
    environment:
      <<: *timezone
    # The browser's one fingerprint, drawn on the first launch and kept, so every restart presents
    # the same device to the sites people are logged into (DockerCompose/camoufox/fingerprint.js).
    volumes:
      - camoufox-identity:/data
    restart: unless-stopped
    networks:
      - jackbot

  mcp-websearch:
    image: mcp-websearch:latest
    logging:
      options:
        max-size: "5m"
        max-file: "3"
    container_name: mcp-websearch
    build:
      context: ${REPOSITORY_PATH}
      dockerfile: McpServerWebSearch/Dockerfile
    restart: unless-stopped
    environment:
      # The secrets this service reads, by name: it is never handed the whole .env.
      OPENROUTER__APIKEY: ${OPENROUTER__APIKEY}
      BRAVESEARCH__APIKEY: ${BRAVESEARCH__APIKEY}
      CAPSOLVER__APIKEY: ${CAPSOLVER__APIKEY}
      <<: *timezone
      REDISCONNECTIONSTRING: redis:6379,password=${REDIS_PASSWORD}
      MCP__SHAREDSECRET: ${MCP_SECRET_WEBSEARCH}
      # Seals each person's remembered logins in Redis (base64 of 32 random bytes; empty is
      # remembering off). Changing it makes every saved login refuse until it is put back.
      LOGINS__STATEKEY: ${LOGINS__STATEKEY}
      # Where people open a login handoff's link: the assistants host Caddy routes /browse/ to this
      # server on (e.g. https://assistants.example.com). Per deployment; empty is the handoff off.
      HANDOFF__PUBLICBASEURL: ""
    networks:
      - jackbot
    depends_on:
      camoufox:
        condition: service_healthy
      base-sdk:
        condition: service_started
      redis:
        condition: service_healthy

  mcp-idealista:
    image: mcp-idealista:latest
    logging:
      options:
        max-size: "5m"
        max-file: "3"
    container_name: mcp-idealista
    build:
      context: ${REPOSITORY_PATH}
      dockerfile: McpServerIdealista/Dockerfile
    restart: unless-stopped
    environment:
      # The secrets this service reads, by name: it is never handed the whole .env.
      IDEALISTA__APIKEY: ${IDEALISTA__APIKEY}
      IDEALISTA__SECRET: ${IDEALISTA__SECRET}
      <<: *timezone
      MCP__SHAREDSECRET: ${MCP_SECRET_IDEALISTA}
    networks:
      - jackbot
    depends_on:
      - base-sdk

  mcp-homeassistant:
    image: mcp-homeassistant:latest
    logging:
      options:
        max-size: "5m"
        max-file: "3"
    container_name: mcp-homeassistant
    # The watch callback (/api/homeassistant/watch-fired) is guarded by the voice hub's announce
    # secret, Announce__Token, which reaches this container through .env like the timers server's.
    # The hub itself is asked to resolve a watch's announcement target when the watch is written.
    # music-assistant runs with network_mode: host, so it is not on the jackbot bridge and its
    # container name does not resolve. Its podcast-episode API is reached via the host gateway.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: ${REPOSITORY_PATH}
      dockerfile: McpServerHomeAssistant/Dockerfile
    restart: unless-stopped
    environment:
      # The secrets this service reads, by name: it is never handed the whole .env.
      HOMEASSISTANT__TOKEN: ${HOMEASSISTANT__TOKEN}
      MUSICASSISTANT__TOKEN: ${MUSICASSISTANT__TOKEN}
      Announce__Token: ${Announce__Token}
      <<: *timezone
      MCP__SHAREDSECRET: ${MCP_SECRET_HOMEASSISTANT}
    networks:
      - jackbot
    depends_on:
      base-sdk:
        condition: service_started
      homeassistant:
        condition: service_started
      mcp-channel-voice:
        condition: service_started

  mcp-channel-signalr:
    image: mcp-channel-signalr:latest
    logging:
      options:
        max-size: "5m"
        max-file: "3"
    container_name: mcp-channel-signalr
    build:
      context: ${REPOSITORY_PATH}
      dockerfile: McpChannelSignalR/Dockerfile
    volumes:
      - chat-uploads:/data/uploads
    restart: unless-stopped
    environment:
      # The secrets this service reads, by name: it is never handed the whole .env.
      WEBPUSH__SUBJECT: ${WEBPUSH__SUBJECT}
      WEBPUSH__PUBLICKEY: ${WEBPUSH__PUBLICKEY}
      WEBPUSH__PRIVATEKEY: ${WEBPUSH__PRIVATEKEY}
      <<: [ *timezone, *cors-origins ]
      REDISCONNECTIONSTRING: redis:6379,password=${REDIS_PASSWORD}
      MCP__SHAREDSECRET: ${MCP_SECRET_CHANNEL_SIGNALR}
      Dictation__Transcription__Model: *stt-model
    networks:
      - jackbot
    depends_on:
      base-sdk:
        condition: service_started
      redis:
        condition: service_healthy

  mcp-channel-telegram:
    image: mcp-channel-telegram:latest
    logging:
      options:
        max-size: "5m"
        max-file: "3"
    container_name: mcp-channel-telegram
    build:
      context: ${REPOSITORY_PATH}
      dockerfile: McpChannelTelegram/Dockerfile
    restart: unless-stopped
    environment:
      # The secrets this service reads, by name: it is never handed the whole .env. Who may use the
      # bots is nobody's list here: a sender is admitted by the account the accounts service has
      # their numeric Telegram id linked to, asked with this server's own MCP credential.
      BOTS__0__BOTTOKEN: ${BOTS__0__BOTTOKEN}
      BOTS__1__BOTTOKEN: ${BOTS__1__BOTTOKEN}
      <<: *timezone
      REDISCONNECTIONSTRING: redis:6379,password=${REDIS_PASSWORD}
      MCP__SHAREDSECRET: ${MCP_SECRET_CHANNEL_TELEGRAM}
      Dictation__Transcription__Model: *stt-model
    networks:
      - jackbot
    depends_on:
      base-sdk:
        condition: service_started
      redis:
        condition: service_healthy

  mcp-scheduling:
    image: mcp-scheduling:latest
    logging:
      options:
        max-size: "5m"
        max-file: "3"
    container_name: mcp-scheduling
    build:
      context: ${REPOSITORY_PATH}
      dockerfile: McpServerScheduling/Dockerfile
    restart: unless-stopped
    environment:
      <<: *timezone
      REDISCONNECTIONSTRING: redis:6379,password=${REDIS_PASSWORD}
      MCP__SHAREDSECRET: ${MCP_SECRET_SCHEDULING}
    networks:
      - jackbot
    depends_on:
      base-sdk:
        condition: service_started
      redis:
        condition: service_healthy

  mcp-printer:
    image: mcp-printer:latest
    logging:
      options:
        max-size: "5m"
        max-file: "3"
    container_name: mcp-printer
    build:
      context: ${REPOSITORY_PATH}
      dockerfile: McpServerPrinter/Dockerfile
    volumes:
      - printer-spool:/spool
    restart: unless-stopped
    environment:
      <<: *timezone
      MCP__SHAREDSECRET: ${MCP_SECRET_PRINTER}
    networks:
      - jackbot
    depends_on:
      base-sdk:
        condition: service_started

  mcp-timers:
    image: mcp-timers:latest
    logging:
      options:
        max-size: "5m"
        max-file: "3"
    container_name: mcp-timers
    build:
      context: ${REPOSITORY_PATH}
      dockerfile: McpServerTimers/Dockerfile
    restart: unless-stopped
    environment:
      # The secrets this service reads, by name: it is never handed the whole .env.
      Announce__Token: ${Announce__Token}
      <<: *timezone
      MCP__SHAREDSECRET: ${MCP_SECRET_TIMERS}
    networks:
      - jackbot
    depends_on:
      base-sdk:
        condition: service_started
      mcp-channel-voice:
        condition: service_started

  # Docker creates a missing bind-mount folder as root, and mcp-sugary runs as PUID, so on a fresh
  # host it could not create its database and restarted forever. This one-shot step, from the same
  # image, hands ./volumes/sugary to PUID:PGID and exits before the server starts. It touches only
  # that folder's own owner, never her files, and is a no-op on every later start.
  mcp-sugary-volume:
    image: mcp-sugary:latest
    container_name: mcp-sugary-volume
    build:
      context: ${REPOSITORY_PATH}
      dockerfile: McpServerSugary/Dockerfile
    user: "0:0"
    entrypoint: ["chown", "${PUID:-1654}:${PGID:-1654}", "/data"]
    volumes:
      - ./volumes/sugary:/data
    restart: "no"
    depends_on:
      base-sdk:
        condition: service_started

  mcp-sugary:
    image: mcp-sugary:latest
    logging:
      options:
        max-size: "5m"
        max-file: "3"
    container_name: mcp-sugary
    # A person's phone reaches the app through Caddy at sugary.herfluffness.com, and nothing else
    # reaches it: the app believes the person the proxy's session check names in the X-Ziggurat-*
    # headers, which a caller past the proxy could set to anybody. Local runs publish it on loopback
    # through docker-compose.override.ports.yml.
    build:
      context: ${REPOSITORY_PATH}
      dockerfile: McpServerSugary/Dockerfile
    restart: unless-stopped
    # Her carb log is a SQLite file in this volume (docs/adr/0043), so it is backed up with the
    # volume and not with Redis. PUID/PGID in .env own ./volumes/sugary; mcp-sugary-volume above
    # sees to that before every start.
    # Carrying the standalone app's log over is one command: put its three downloads
    # (sugary-meals.csv, sugary-items.csv, sugary-foods.csv) in ./volumes/sugary/import, then
    #   docker exec mcp-sugary dotnet McpServerSugary.dll import /data/import
    # A meal or food already here is left alone, so running it twice adds nothing.
    user: ${PUID:-1654}:${PGID:-1654}
    volumes:
      - ./volumes/sugary:/data
    environment:
      # The secrets this service reads, by name: it is never handed the whole .env.
      WEBPUSH__SUBJECT: ${WEBPUSH__SUBJECT}
      WEBPUSH__PUBLICKEY: ${WEBPUSH__PUBLICKEY}
      WEBPUSH__PRIVATEKEY: ${WEBPUSH__PRIVATEKEY}
      # Also the zone the tables' times are written in (HomeZone empty): the same anchor the Home
      # Assistant container runs on, so a meal lines up with the glucose history /ha serves.
      <<: *timezone
      # The app is served on this port too (every route but /mcp), through Caddy over HTTPS, which
      # installing it and live scanning need, and behind the proxy's session check: it has no sign-in
      # of its own. /mcp keeps this server's own credential.
      MCP__SHAREDSECRET: ${MCP_SECRET_SUGARY}
    networks:
      - jackbot
    depends_on:
      mcp-sugary-volume:
        condition: service_completed_successfully
      base-sdk:
        condition: service_started

  mcp-channel-voice:
    image: mcp-channel-voice:latest
    logging:
      options:
        max-size: "5m"
        max-file: "3"
    container_name: mcp-channel-voice
    build:
      context: ${REPOSITORY_PATH}
      dockerfile: McpChannelVoice/Dockerfile
    restart: unless-stopped
    # The hub writes the bind mounts below (profile.json cache, audit ring). PUID/PGID in
    # .env — the same pair the other volume-writing services use — must own ./volumes/voices
    # instead of chowning the host dirs to the image default (1654, the aspnet app user).
    user: ${PUID:-1654}:${PGID:-1654}
    volumes:
      - ./volumes/voices:/voices
      - ./volumes/tse-audit:/tse-audit
    environment:
      # The secrets this service reads, by name: it is never handed the whole .env.
      OPENROUTER__APIKEY: ${OPENROUTER__APIKEY}
      Announce__Token: ${Announce__Token}
      <<: *timezone
      REDISCONNECTIONSTRING: redis:6379,password=${REDIS_PASSWORD}
      MCP__SHAREDSECRET: ${MCP_SECRET_CHANNEL_VOICE}
      Announce__Escalation__WebhookUrl: ""
      Stt__OpenAi__Model: *stt-model
      Tse__Mode: "${Tse__Mode:-Off}"
      Tse__Endpoint: "${Tse__Endpoint:-http://tse-extractor:9098}"
      Tse__TimeoutMs: "${Tse__TimeoutMs:-90000}"
      Tse__NoiseFloorThreshold: "${Tse__NoiseFloorThreshold:-400}"
      Tse__AuditDir: "${Tse__AuditDir:-}"
    networks:
      - jackbot
    depends_on:
      base-sdk:
        condition: service_started
      redis:
        condition: service_healthy
      lemonade:
        condition: service_healthy

  lemonade:
    image: lemonade:latest
    logging:
      options:
        max-size: "5m"
        max-file: "3"
    container_name: lemonade
    build: ./lemonade
    ports:
      - "${LAN_BIND_ADDRESS:-127.0.0.1}:13305:13305"
    environment:
      <<: *timezone
      STT_BACKEND: ${STT_BACKEND:-gpu}
      # Warmed by the entrypoint's pre-pull; kept in lockstep with the hub's Stt__OpenAi__Model
      # (mcp-channel-voice above) so an override warms the model the hub actually requests instead
      # of leaving the container to lazily download the right one on the first utterance.
      STT_MODEL: *stt-model
      # Only read when STT_MODEL names a `user.` model, which Lemonade knows nothing about until
      # the pre-pull registers it. Lemonade resolves checkpoints against HuggingFace/ModelScope
      # only, so a self-converted model has to be published before it can be named here. The
      # Spanish fine-tune is org/repo:file.bin form, e.g.
      # Sendery/whisper-large-v3-turbo-es-ggml:ggml-model.bin.
      STT_MODEL_CHECKPOINT:
      # Decode-quality knobs, passed through only when set (defaults — VAD 0.6, beam 5,
      # Castilian initial prompt, best-of 5, non-speech-token suppression on, VAD speech
      # padding 150 ms, VAD minimum speech 150 ms — live in lemonade/entrypoint.sh; set one
      # empty in .env to disable it). The last four target short commands: whisper.cpp's own
      # 30 ms padding clips a leading plosive off a one-word turn and its 250 ms minimum
      # discards one outright. The NPU/flm tier ignores all of them.
      STT_VAD_THRESHOLD:
      STT_INITIAL_PROMPT:
      STT_BEAM_SIZE:
      STT_BEST_OF:
      STT_SUPPRESS_NST:
      STT_VAD_SPEECH_PAD_MS:
      STT_VAD_MIN_SPEECH_MS:
    # Vulkan whisper on the Ryzen AI iGPU. Kokoro TTS is CPU-only on Linux, so it never
    # contends with whisper for the iGPU. Only /dev/dri is mapped: the shipped Vulkan tier
    # (RADV) needs just the render node, so this stays up on non-AMD hosts that have /dev/dri
    # but no /dev/kfd (Intel iGPU, Raspberry Pi). /dev/kfd (ROCm compute) is never mapped —
    # the 890M runs Vulkan/RADV here, not ROCm/HIP. The opt-in NPU tier
    # (docker-compose.override.npu.yml) instead adds /dev/accel/accel0, the XDNA NPU node.
    devices:
      - /dev/dri:/dev/dri
    # /dev/dri/renderD* is root:render 0660 on Ubuntu/Debian, and --device preserves host
    # ownership. UID 10001 is in no such group, so without this the render node is EACCES,
    # ggml-vulkan enumerates zero devices, and whisper silently decodes on CPU. Set RENDER_GID
    # from the target host: getent group render | cut -d: -f3
    group_add:
      - "${RENDER_GID:-993}"
    # Since v11 the image runs as unprivileged UID 10001 with HOME=/opt/lemonade — these are the
    # real cache paths, and lemonade-recipe is also where the entrypoint points lemond's config
    # directory, so nothing it persists lives outside a mount. (Pre-v11 /root/.cache/* mounts are
    # silently dead: the server still runs but writes land in the container layer and every model
    # re-downloads on recreate.)
    volumes:
      - ./volumes/lemonade-hf-cache:/opt/lemonade/.cache/huggingface
      - ./volumes/lemonade-recipe:/opt/lemonade/.cache/lemonade
      - ./volumes/lemonade-llama:/opt/lemonade/llama
    # Healthy = the server answers; the entrypoint's model pre-pull is best-effort and not
    # gated on. start_period covers slow first boots without counting against retries.
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://127.0.0.1:13305/api/v1/health" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    networks:
      - jackbot

  tse-extractor:
    image: tse-extractor:latest
    logging:
      options:
        max-size: "5m"
        max-file: "3"
    container_name: tse-extractor
    build:
      context: ./tse-extractor
    restart: unless-stopped
    # Writes the /models bind mount (checkpoint provisioning, ONNX export, enroll cache), so it
    # follows the same PUID/PGID convention as the other volume-writing services: PUID must own
    # ./volumes/tse-models. Deployments that ran the pre-user root container need a one-time
    # chown of that dir or provisioning/export/cache writes fail after the upgrade.
    user: ${PUID:-1654}:${PGID:-1654}
    environment:
      # 0 = auto: one torch thread per PHYSICAL core (SMT oversubscription measured ~1.6x
      # slower — see app.py). Set an explicit count only to tune away from that.
      TSE_TORCH_THREADS: "${TSE_TORCH_THREADS:-0}"
      # 1 = run the BSRNN core via onnxruntime (parity-gated at startup; any failure
      # falls back to eager torch). 0 = force the eager path.
      TSE_ONNX: "${TSE_ONNX:-1}"
      # Persist the concat-enrollment + speaker-embedding cache in the models volume so
      # a container recreate doesn't recompute the embedding inside the first live turn.
      ENROLL_CACHE: /models/enroll-cache
    volumes:
      - ./volumes/tse-models:/models
      - ./volumes/voices:/voices:ro
    networks:
      - jackbot

  agent:
    image: agent:latest
    logging:
      options:
        max-size: "5m"
        max-file: "3"
    container_name: agent
    build:
      context: ${REPOSITORY_PATH}
      dockerfile: Agent/Dockerfile
    command: [ "--chat", "Web", "--reasoning" ]
    restart: unless-stopped
    environment:
      # The secrets this service reads, by name: it is never handed the whole .env.
      OPENROUTER__APIKEY: ${OPENROUTER__APIKEY}
      LemonadeChat__ApiUrl: ${LemonadeChat__ApiUrl}
      LemonadeChat__ApiKey: ${LemonadeChat__ApiKey}
      OUTPOSTS__SHAREDSECRET: ${OUTPOSTS__SHAREDSECRET}
      <<: [ *timezone, *cors-origins ]
      REDIS__CONNECTIONSTRING: redis:6379,password=${REDIS_PASSWORD}
      # Each server's credential by the host the agent dials, the same variable the server
      # reads as its own MCP__SHAREDSECRET.
      MCP__SECRETS__mcp-library: ${MCP_SECRET_LIBRARY}
      MCP__SECRETS__mcp-vault: ${MCP_SECRET_VAULT}
      MCP__SECRETS__mcp-sandbox: ${MCP_SECRET_SANDBOX}
      MCP__SECRETS__mcp-websearch: ${MCP_SECRET_WEBSEARCH}
      MCP__SECRETS__mcp-idealista: ${MCP_SECRET_IDEALISTA}
      MCP__SECRETS__mcp-homeassistant: ${MCP_SECRET_HOMEASSISTANT}
      MCP__SECRETS__mcp-channel-signalr: ${MCP_SECRET_CHANNEL_SIGNALR}
      MCP__SECRETS__mcp-channel-telegram: ${MCP_SECRET_CHANNEL_TELEGRAM}
      MCP__SECRETS__mcp-scheduling: ${MCP_SECRET_SCHEDULING}
      MCP__SECRETS__mcp-printer: ${MCP_SECRET_PRINTER}
      MCP__SECRETS__mcp-timers: ${MCP_SECRET_TIMERS}
      MCP__SECRETS__mcp-sugary: ${MCP_SECRET_SUGARY}
      MCP__SECRETS__mcp-channel-voice: ${MCP_SECRET_CHANNEL_VOICE}
      AGENTAPI__SHAREDSECRET: ${AGENTAPI__SHAREDSECRET}
    # The sandbox's network too, which only the two of them are on.
    networks:
      - jackbot
      - sandbox
    depends_on:
      mcp-library:
        condition: service_started
      mcp-vault:
        condition: service_started
      mcp-sandbox:
        condition: service_started
      mcp-websearch:
        condition: service_started
      mcp-idealista:
        condition: service_started
      mcp-homeassistant:
        condition: service_started
      mcp-channel-signalr:
        condition: service_started
      mcp-channel-telegram:
        condition: service_started
      mcp-scheduling:
        condition: service_started
      mcp-printer:
        condition: service_started
      mcp-channel-voice:
        condition: service_started
      mcp-sugary:
        condition: service_started
      redis:
        condition: service_healthy
      base-sdk:
        condition: service_started

  webui:
    image: webui:latest
    logging:
      options:
        max-size: "5m"
        max-file: "3"
    container_name: webui
    build:
      context: ${REPOSITORY_PATH}
      dockerfile: WebChat/Dockerfile
    environment:
      # The secrets this service reads, by name: it is never handed the whole .env.
      WEBPUSH__PUBLICKEY: ${WEBPUSH__PUBLICKEY}
      <<: *timezone
    restart: unless-stopped
    networks:
      - jackbot
    depends_on:
      - agent
      - base-sdk

  observability:
    image: observability:latest
    logging:
      options:
        max-size: "5m"
        max-file: "3"
    container_name: observability
    # music-assistant runs with network_mode: host (for mDNS/zeroconf discovery), so it
    # is not on the jackbot bridge and its container name no longer resolves. The health
    # probe reaches its host-published port via the host gateway instead.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: ${REPOSITORY_PATH}
      dockerfile: Observability/Dockerfile
    environment:
      # The secrets this service reads, by name: it is never handed the whole .env.
      LemonadeChat__ApiUrl: ${LemonadeChat__ApiUrl}
      LemonadeChat__ApiKey: ${LemonadeChat__ApiKey}
      <<: *timezone
      REDIS__CONNECTIONSTRING: redis:6379,password=${REDIS_PASSWORD}
      # LemonadeChat__ApiUrl arrives through .env, as it does for the agent: the probe row for
      # the Lemonade chat host exists only when that line is set. A literal here would win over
      # .env and keep the probe off.
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - jackbot

  # Docker creates a missing bind-mount folder as root, and accounts runs as PUID, so on a fresh host
  # it could not create its store. This one-shot step, from the same image, hands ./volumes/accounts
  # to PUID:PGID and exits before the service starts; it is a no-op on every later start.
  accounts-volume:
    image: accounts:latest
    container_name: accounts-volume
    build:
      context: ${REPOSITORY_PATH}
      dockerfile: Accounts/Dockerfile
    user: "0:0"
    entrypoint: ["chown", "${PUID:-1654}:${PGID:-1654}", "/data"]
    volumes:
      - ./volumes/accounts:/data
    restart: "no"
    depends_on:
      base-sdk:
        condition: service_started

  # Households, people, passkeys, invites and sessions. Caddy routes /accounts/* on the main host
  # here (sign-in, enrollment) and asks /accounts/verify about every protected request; nothing
  # else reaches it. Its store is a SQLite file in this volume, backed up with the volume. The
  # operator's way in, before anyone can sign in and after losing every passkey:
  #   docker exec accounts dotnet Accounts.dll mint-link --operator --name "<display name>"
  # and a recovery link for anyone: docker exec accounts dotnet Accounts.dll mint-link --user <id>
  accounts:
    image: accounts:latest
    logging:
      options:
        max-size: "5m"
        max-file: "3"
    container_name: accounts
    build:
      context: ${REPOSITORY_PATH}
      dockerfile: Accounts/Dockerfile
    restart: unless-stopped
    user: ${PUID:-1654}:${PGID:-1654}
    volumes:
      - ./volumes/accounts:/data
    environment:
      <<: *timezone
      # Per deployment, not secrets. A passkey belongs to the parent domain, so one signs in on every
      # host under it; the session cookie is set there for the same reason. The origins are the
      # hosts the Caddyfile serves people on: a ceremony's page must be on one, and sign-in returns
      # only to one. Links the operator's command prints start with the public base.
      WEBAUTHN__RELYINGPARTYID: herfluffness.com
      ALLOWEDORIGINS__0: https://assistants.herfluffness.com
      ALLOWEDORIGINS__1: https://sexy.herfluffness.com
      ALLOWEDORIGINS__2: https://sugary.herfluffness.com
      ALLOWEDORIGINS__3: https://assistants-dashboard.herfluffness.com
      SESSIONCOOKIE__DOMAIN: .herfluffness.com
      PUBLICBASEURL: https://assistants.herfluffness.com
      # The bot people link their Telegram through, without the @: the account page's link code
      # and an invite are shown as its t.me deep link. Left empty they are shown as a bare code to
      # send the bot as /start <code>, which is safe; a wrong name would send codes to a stranger's bot.
      TELEGRAM__BOTUSERNAME: ""
      # The servers that may ask whose account an identity is, each by the credential it already
      # holds for its own /mcp, so no secret exists for this alone. Caddy answers the internal API
      # 404 from outside.
      CALLERS__mcp-channel-signalr: ${MCP_SECRET_CHANNEL_SIGNALR}
      CALLERS__mcp-channel-telegram: ${MCP_SECRET_CHANNEL_TELEGRAM}
      CALLERS__mcp-channel-voice: ${MCP_SECRET_CHANNEL_VOICE}
      # The household migration below, and only its household import: it can make the operator and
      # mint their link, so it is admitted by a secret of its own, left empty — nobody — but for the run.
      CALLERS__household-migration: ${HOUSEHOLD_MIGRATION_SECRET}
    networks:
      - jackbot
    depends_on:
      accounts-volume:
        condition: service_completed_successfully
      base-sdk:
        condition: service_started

  # One-shot, by hand, on the deploy that brings accounts: carries the retired identity map's people
  # into the home household as accounts, and what was filed under their names — memories, remembered
  # logins, phones, schedules' writers, topics, voice profiles, the Sugary log — onto their user ids.
  # Under a profile, so `up` never starts it. Put the people in ./volumes/household-migration/people.json
  # and HOUSEHOLD_MIGRATION_SECRET in .env (then `docker compose up -d accounts`), and run
  #   docker compose --profile migrate run --rm household-migration \
  #     --people /input/people.json --operator <name> --owner <name> --sugary <name> [--dry-run]
  # Running it again changes nothing. The steps are .scratch/accounts/spec.md's Further Notes.
  household-migration:
    image: household-migration:latest
    profiles: ["migrate"]
    build:
      context: ${REPOSITORY_PATH}
      dockerfile: HouseholdMigration/Dockerfile
    restart: "no"
    # The owner of the Sugary and voices volumes it writes in, as their services run.
    user: ${PUID:-1654}:${PGID:-1654}
    volumes:
      - ./volumes/household-migration:/input:ro
      - ./volumes/sugary:/sugary
      - ./volumes/voices:/voices
    environment:
      <<: *timezone
      REDISCONNECTIONSTRING: redis:6379,password=${REDIS_PASSWORD}
      ACCOUNTS__CREDENTIAL: ${HOUSEHOLD_MIGRATION_SECRET}
      # Opens each remembered login sealed under a person's name and seals it again under their user id.
      LOGINS__STATEKEY: ${LOGINS__STATEKEY}
    networks:
      - jackbot
    depends_on:
      base-sdk:
        condition: service_started
      redis:
        condition: service_healthy
      accounts:
        condition: service_started

  caddy:
    build:
      context: ./caddy
    logging:
      options:
        max-size: "5m"
        max-file: "3"
    container_name: caddy
    ports:
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - ./volumes/caddy_data:/data
      - ./volumes/caddy_config:/config
    environment:
      <<: *timezone
      CF_API_TOKEN: ${CF_API_TOKEN}
    restart: unless-stopped
    networks:
      - jackbot
    depends_on:
      - webui
      - agent
      - mcp-sugary
      - accounts

networks:
  jackbot:
  sandbox:

volumes:
  printer-spool:
  chat-uploads:
  camoufox-identity:
