name: jackbot

# Single source of truth for the agent's operating timezone (applied to the two
# containers that surface time to the LLM / fire schedules).
x-timezone: &timezone
  TZ: Europe/Madrid

# One name for the STT model on every side at once: the lemonade entrypoint pre-pulls it, and both
# chat channels request it, as a household's voice server does over its tunnel (the tenant kit's
# STT_MODEL names the same). They must agree or the model that decodes is not the model that was
# warmed, and every transcription pays for a lazy pull of a second one.
x-stt-model: &stt-model ${STT_MODEL:-Whisper-Large-v3-Turbo}

# The browser origins the agent's registration API and the hub answer with a visitor's
# credentials: the deployment's own hosts, the ones the Caddyfile serves them on. Per deployment,
# and one list for both so they cannot disagree; a page on any other origin gets no CORS headers.
# Add a host as __2, __3 ...; with none at all both are same-origin only.
x-cors-origins: &cors-origins
  CORS__ALLOWEDORIGINS__0: https://assistants.herfluffness.com
  CORS__ALLOWEDORIGINS__1: https://sexy.herfluffness.com

services:
  redis:
    image: redis/redis-stack-server:latest
    logging:
      options:
        max-size: "5m"
        max-file: "3"
    container_name: redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./volumes/redis_data:/data
    environment:
      <<: *timezone
      REDIS_ARGS: "--appendonly yes --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"
      # redis-cli reads it, so the health check below authenticates without the password in
      # its command line.
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - jackbot

  # A household's own servers — web search with its browser, the vault, the library with qBittorrent
  # and Jackett, the sandbox, the printer, Home Assistant with Music Assistant, and voice with speech
  # extraction — are not here, nor the household's LAN tools over its media (Plex, filebrowser): they
  # run in the tenant kit (TenantKit/) at the household's site, the servers reaching this deployment
  # through their tunnels to the relay in the agent, so this file carries none of their mounts,
  # devices, satellites or secrets. Lemonade below is the shared box, and the one service handed a
  # device.
  base-sdk:
    image: base-sdk:latest
    build:
      context: ${REPOSITORY_PATH}
      dockerfile: Dockerfile.base-sdk
      labels:
        keep: "true"
    entrypoint: ["true"]
    environment:
      <<: *timezone
    restart: "no"
    networks:
      - jackbot

  mcp-idealista:
    image: mcp-idealista:latest
    logging:
      options:
        max-size: "5m"
        max-file: "3"
    container_name: mcp-idealista
    build:
      context: ${REPOSITORY_PATH}
      dockerfile: McpServerIdealista/Dockerfile
    restart: unless-stopped
    environment:
      # No Idealista key of the deployment's: every search is made with the calling household's own,
      # asked of the accounts service (its keys section) with this server's credential below.
      <<: *timezone
      MCP__SHAREDSECRET: ${MCP_SECRET_IDEALISTA}
      # A tool call's token: the agent's, for this name, checked against the keys it publishes.
      MCP__AUDIENCE: mcp-idealista
      MCP__AGENTKEYSURL: http://agent:8080/internal/jwks
    networks:
      - jackbot
    depends_on:
      - base-sdk

  mcp-channel-signalr:
    image: mcp-channel-signalr:latest
    logging:
      options:
        max-size: "5m"
        max-file: "3"
    container_name: mcp-channel-signalr
    build:
      context: ${REPOSITORY_PATH}
      dockerfile: McpChannelSignalR/Dockerfile
    volumes:
      - chat-uploads:/data/uploads
    restart: unless-stopped
    environment:
      # The secrets this service reads, by name: it is never handed the whole .env.
      WEBPUSH__SUBJECT: ${WEBPUSH__SUBJECT}
      WEBPUSH__PUBLICKEY: ${WEBPUSH__PUBLICKEY}
      WEBPUSH__PRIVATEKEY: ${WEBPUSH__PRIVATEKEY}
      <<: [ *timezone, *cors-origins ]
      REDISCONNECTIONSTRING: redis:6379,password=${REDIS_PASSWORD}
      MCP__SHAREDSECRET: ${MCP_SECRET_CHANNEL_SIGNALR}
      # A tool call's token: the agent's, for this name, checked against the keys it publishes.
      MCP__AUDIENCE: mcp-channel-signalr
      MCP__AGENTKEYSURL: http://agent:8080/internal/jwks
      Dictation__Transcription__Model: *stt-model
      # Where the accounts service publishes the keys its assertions verify with: this app believes
      # the person X-Ziggurat-Assertion names, never the plain headers beside it.
      ACCOUNTS__JWKSURL: http://accounts:8080/accounts/internal/jwks
    networks:
      - jackbot
    depends_on:
      base-sdk:
        condition: service_started
      redis:
        condition: service_healthy

  mcp-channel-telegram:
    image: mcp-channel-telegram:latest
    logging:
      options:
        max-size: "5m"
        max-file: "3"
    container_name: mcp-channel-telegram
    build:
      context: ${REPOSITORY_PATH}
      dockerfile: McpChannelTelegram/Dockerfile
    restart: unless-stopped
    environment:
      # The secrets this service reads, by name: it is never handed the whole .env. Who may use the
      # bots is nobody's list here: a sender is admitted by the account the accounts service has
      # their numeric Telegram id linked to, asked with this server's own MCP credential. The shared
      # bot serves every household; a household's own bots (the home's jack and jonas) are its
      # configuration's keys, read from the accounts service with the same credential.
      BOTS__SHAREDTOKEN: ${TELEGRAM_SHARED_BOT_TOKEN}
      <<: *timezone
      REDISCONNECTIONSTRING: redis:6379,password=${REDIS_PASSWORD}
      MCP__SHAREDSECRET: ${MCP_SECRET_CHANNEL_TELEGRAM}
      # A tool call's token: the agent's, for this name, checked against the keys it publishes.
      MCP__AUDIENCE: mcp-channel-telegram
      MCP__AGENTKEYSURL: http://agent:8080/internal/jwks
      Dictation__Transcription__Model: *stt-model
    networks:
      - jackbot
    depends_on:
      base-sdk:
        condition: service_started
      redis:
        condition: service_healthy

  mcp-scheduling:
    image: mcp-scheduling:latest
    logging:
      options:
        max-size: "5m"
        max-file: "3"
    container_name: mcp-scheduling
    build:
      context: ${REPOSITORY_PATH}
      dockerfile: McpServerScheduling/Dockerfile
    restart: unless-stopped
    environment:
      <<: *timezone
      REDISCONNECTIONSTRING: redis:6379,password=${REDIS_PASSWORD}
      MCP__SHAREDSECRET: ${MCP_SECRET_SCHEDULING}
      # A tool call's token: the agent's, for this name, checked against the keys it publishes.
      MCP__AUDIENCE: mcp-scheduling
      MCP__AGENTKEYSURL: http://agent:8080/internal/jwks
    networks:
      - jackbot
    depends_on:
      base-sdk:
        condition: service_started
      redis:
        condition: service_healthy

  mcp-timers:
    image: mcp-timers:latest
    logging:
      options:
        max-size: "5m"
        max-file: "3"
    container_name: mcp-timers
    build:
      context: ${REPOSITORY_PATH}
      dockerfile: McpServerTimers/Dockerfile
    restart: unless-stopped
    environment:
      # The secrets this service reads, by name: it is never handed the whole .env.
      <<: *timezone
      MCP__SHAREDSECRET: ${MCP_SECRET_TIMERS}
      # A tool call's token: the agent's, for this name, checked against the keys it publishes.
      MCP__AUDIENCE: mcp-timers
      MCP__AGENTKEYSURL: http://agent:8080/internal/jwks
      # The household's voice server, which rings its satellites, has no address here: it is reached
      # through the relay's endpoint on the agent, down its tunnel. The relay asks this server's name
      # and its own credential above (the agent's MCP__SECRETS__mcp-timers), and presents the voice
      # server the credential of its tunnel, so no announce secret is needed.
      VOICEHUB__BASEURL: http://agent:8080/internal/relay/voice/
    networks:
      - jackbot
    depends_on:
      base-sdk:
        condition: service_started

  # Docker creates a missing bind-mount folder as root, and mcp-sugary runs as PUID, so on a fresh
  # host it could not create its database and restarted forever. This one-shot step, from the same
  # image, hands ./volumes/sugary to PUID:PGID and exits before the server starts. It touches only
  # that folder's own owner, never her files, and is a no-op on every later start.
  mcp-sugary-volume:
    image: mcp-sugary:latest
    container_name: mcp-sugary-volume
    build:
      context: ${REPOSITORY_PATH}
      dockerfile: McpServerSugary/Dockerfile
    user: "0:0"
    entrypoint: ["chown", "${PUID:-1654}:${PGID:-1654}", "/data"]
    volumes:
      - ./volumes/sugary:/data
    restart: "no"
    depends_on:
      base-sdk:
        condition: service_started

  mcp-sugary:
    image: mcp-sugary:latest
    logging:
      options:
        max-size: "5m"
        max-file: "3"
    container_name: mcp-sugary
    # A person's phone reaches the app through Caddy at sugary.herfluffness.com, and nothing else
    # reaches it: the app believes the person the proxy's session check signs in X-Ziggurat-Assertion,
    # verified against the accounts service's keys, never the plain X-Ziggurat-* headers a caller past
    # the proxy could set to anybody. Local runs publish it on loopback through
    # docker-compose.override.ports.yml.
    build:
      context: ${REPOSITORY_PATH}
      dockerfile: McpServerSugary/Dockerfile
    restart: unless-stopped
    # Her carb log is a SQLite file in this volume (docs/adr/0043), so it is backed up with the
    # volume and not with Redis. PUID/PGID in .env own ./volumes/sugary; mcp-sugary-volume above
    # sees to that before every start.
    # Carrying the standalone app's log over is one command: put its three downloads
    # (sugary-meals.csv, sugary-items.csv, sugary-foods.csv) in ./volumes/sugary/import, then
    #   docker exec mcp-sugary dotnet McpServerSugary.dll import /data/import
    # A meal or food already here is left alone, so running it twice adds nothing.
    user: ${PUID:-1654}:${PGID:-1654}
    volumes:
      - ./volumes/sugary:/data
    environment:
      # The secrets this service reads, by name: it is never handed the whole .env.
      WEBPUSH__SUBJECT: ${WEBPUSH__SUBJECT}
      WEBPUSH__PUBLICKEY: ${WEBPUSH__PUBLICKEY}
      WEBPUSH__PRIVATEKEY: ${WEBPUSH__PRIVATEKEY}
      # Also the zone the tables' times are written in (HomeZone empty): the same anchor the Home
      # Assistant container runs on, so a meal lines up with the glucose history /ha serves.
      <<: *timezone
      # The app is served on this port too (every route but /mcp), through Caddy over HTTPS, which
      # installing it and live scanning need, and behind the proxy's session check: it has no sign-in
      # of its own. /mcp keeps this server's own credential.
      MCP__SHAREDSECRET: ${MCP_SECRET_SUGARY}
      # A tool call's token: the agent's, for this name, checked against the keys it publishes.
      MCP__AUDIENCE: mcp-sugary
      MCP__AGENTKEYSURL: http://agent:8080/internal/jwks
      # Where the accounts service publishes the keys its assertions verify with: this app believes
      # the person X-Ziggurat-Assertion names, never the plain headers beside it.
      ACCOUNTS__JWKSURL: http://accounts:8080/accounts/internal/jwks
    networks:
      - jackbot
    depends_on:
      mcp-sugary-volume:
        condition: service_completed_successfully
      base-sdk:
        condition: service_started

  lemonade:
    image: lemonade:latest
    logging:
      options:
        max-size: "5m"
        max-file: "3"
    container_name: lemonade
    build: ./lemonade
    ports:
      - "${LAN_BIND_ADDRESS:-127.0.0.1}:13305:13305"
    environment:
      <<: *timezone
      STT_BACKEND: ${STT_BACKEND:-gpu}
      # Warmed by the entrypoint's pre-pull; kept in lockstep with what voice requests (the tenant
      # kit's STT_MODEL), which reaches this Lemonade over its tunnel's lemonade back-call, so an
      # override warms the model voice actually requests instead of leaving the container to lazily
      # download the right one on the first utterance.
      STT_MODEL: *stt-model
      # Only read when STT_MODEL names a `user.` model, which Lemonade knows nothing about until
      # the pre-pull registers it. Lemonade resolves checkpoints against HuggingFace/ModelScope
      # only, so a self-converted model has to be published before it can be named here. The
      # Spanish fine-tune is org/repo:file.bin form, e.g.
      # Sendery/whisper-large-v3-turbo-es-ggml:ggml-model.bin.
      STT_MODEL_CHECKPOINT:
      # Decode-quality knobs, passed through only when set (defaults — VAD 0.6, beam 5,
      # Castilian initial prompt, best-of 5, non-speech-token suppression on, VAD speech
      # padding 150 ms, VAD minimum speech 150 ms — live in lemonade/entrypoint.sh; set one
      # empty in .env to disable it). The last four target short commands: whisper.cpp's own
      # 30 ms padding clips a leading plosive off a one-word turn and its 250 ms minimum
      # discards one outright. The NPU/flm tier ignores all of them.
      STT_VAD_THRESHOLD:
      STT_INITIAL_PROMPT:
      STT_BEAM_SIZE:
      STT_BEST_OF:
      STT_SUPPRESS_NST:
      STT_VAD_SPEECH_PAD_MS:
      STT_VAD_MIN_SPEECH_MS:
    # Vulkan whisper on the Ryzen AI iGPU. Kokoro TTS is CPU-only on Linux, so it never
    # contends with whisper for the iGPU. Only /dev/dri is mapped: the shipped Vulkan tier
    # (RADV) needs just the render node, so this stays up on non-AMD hosts that have /dev/dri
    # but no /dev/kfd (Intel iGPU, Raspberry Pi). /dev/kfd (ROCm compute) is never mapped —
    # the 890M runs Vulkan/RADV here, not ROCm/HIP. The opt-in NPU tier
    # (docker-compose.override.npu.yml) instead adds /dev/accel/accel0, the XDNA NPU node.
    devices:
      - /dev/dri:/dev/dri
    # /dev/dri/renderD* is root:render 0660 on Ubuntu/Debian, and --device preserves host
    # ownership. UID 10001 is in no such group, so without this the render node is EACCES,
    # ggml-vulkan enumerates zero devices, and whisper silently decodes on CPU. Set RENDER_GID
    # from the target host: getent group render | cut -d: -f3
    group_add:
      - "${RENDER_GID:-993}"
    # Since v11 the image runs as unprivileged UID 10001 with HOME=/opt/lemonade — these are the
    # real cache paths, and lemonade-recipe is also where the entrypoint points lemond's config
    # directory, so nothing it persists lives outside a mount. (Pre-v11 /root/.cache/* mounts are
    # silently dead: the server still runs but writes land in the container layer and every model
    # re-downloads on recreate.)
    volumes:
      - ./volumes/lemonade-hf-cache:/opt/lemonade/.cache/huggingface
      - ./volumes/lemonade-recipe:/opt/lemonade/.cache/lemonade
      - ./volumes/lemonade-llama:/opt/lemonade/llama
    # Healthy = the server answers; the entrypoint's model pre-pull is best-effort and not
    # gated on. start_period covers slow first boots without counting against retries.
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://127.0.0.1:13305/api/v1/health" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    networks:
      - jackbot

  # Docker creates a missing bind-mount folder as root, and the agent runs as PUID, so on a fresh host
  # it could not write its signing key. This one-shot step, from the same image, hands
  # ./volumes/agent-keys to PUID:PGID and exits before the agent starts; a no-op on every later start.
  agent-volume:
    image: agent:latest
    container_name: agent-volume
    build:
      context: ${REPOSITORY_PATH}
      dockerfile: Agent/Dockerfile
    user: "0:0"
    entrypoint: ["chown", "${PUID:-1654}:${PGID:-1654}", "/keys"]
    volumes:
      - ./volumes/agent-keys:/keys
    restart: "no"
    depends_on:
      base-sdk:
        condition: service_started

  agent:
    image: agent:latest
    logging:
      options:
        max-size: "5m"
        max-file: "3"
    container_name: agent
    build:
      context: ${REPOSITORY_PATH}
      dockerfile: Agent/Dockerfile
    command: [ "--chat", "Web", "--reasoning" ]
    restart: unless-stopped
    # The agent signs every call it makes to a server with a key it generates into this volume on
    # first start, nothing to provision, and publishes the public half at /internal/jwks on the compose
    # network alone. Losing the volume costs a new key, which every server picks up on its own.
    user: ${PUID:-1654}:${PGID:-1654}
    volumes:
      - ./volumes/agent-keys:/keys
    environment:
      SIGNING__KEYDIRECTORY: /keys
      # The secrets this service reads, by name: it is never handed the whole .env.
      OPENROUTER__APIKEY: ${OPENROUTER__APIKEY}
      LemonadeChat__ApiUrl: ${LemonadeChat__ApiUrl}
      LemonadeChat__ApiKey: ${LemonadeChat__ApiKey}
      <<: [ *timezone, *cors-origins ]
      REDIS__CONNECTIONSTRING: redis:6379,password=${REDIS_PASSWORD}
      # Each shared server's credential by the host the agent dials, the same variable the server
      # reads as its own MCP__SHAREDSECRET. A household's own servers have none here: each is reached
      # through its tunnel, whose relay presents the credential the tunnel was opened with.
      MCP__SECRETS__mcp-idealista: ${MCP_SECRET_IDEALISTA}
      MCP__SECRETS__mcp-channel-signalr: ${MCP_SECRET_CHANNEL_SIGNALR}
      MCP__SECRETS__mcp-channel-telegram: ${MCP_SECRET_CHANNEL_TELEGRAM}
      MCP__SECRETS__mcp-scheduling: ${MCP_SECRET_SCHEDULING}
      MCP__SECRETS__mcp-timers: ${MCP_SECRET_TIMERS}
      MCP__SECRETS__mcp-sugary: ${MCP_SECRET_SUGARY}
      AGENTAPI__SHAREDSECRET: ${AGENTAPI__SHAREDSECRET}
      # Where the accounts service publishes the keys its assertions verify with: the registration
      # API acts for the person the X-Ziggurat-Assertion SexyTime's server forwards names.
      ACCOUNTS__JWKSURL: http://accounts:8080/accounts/internal/jwks
    networks:
      - jackbot
    depends_on:
      mcp-idealista:
        condition: service_started
      mcp-channel-signalr:
        condition: service_started
      mcp-channel-telegram:
        condition: service_started
      mcp-scheduling:
        condition: service_started
      mcp-sugary:
        condition: service_started
      redis:
        condition: service_healthy
      agent-volume:
        condition: service_completed_successfully
      base-sdk:
        condition: service_started

  webui:
    image: webui:latest
    logging:
      options:
        max-size: "5m"
        max-file: "3"
    container_name: webui
    build:
      context: ${REPOSITORY_PATH}
      dockerfile: WebChat/Dockerfile
    environment:
      # The secrets this service reads, by name: it is never handed the whole .env.
      WEBPUSH__PUBLICKEY: ${WEBPUSH__PUBLICKEY}
      <<: *timezone
    restart: unless-stopped
    networks:
      - jackbot
    depends_on:
      - agent
      - base-sdk

  observability:
    image: observability:latest
    logging:
      options:
        max-size: "5m"
        max-file: "3"
    container_name: observability
    build:
      context: ${REPOSITORY_PATH}
      dockerfile: Observability/Dockerfile
    environment:
      # The secrets this service reads, by name: it is never handed the whole .env.
      LemonadeChat__ApiUrl: ${LemonadeChat__ApiUrl}
      LemonadeChat__ApiKey: ${LemonadeChat__ApiKey}
      <<: *timezone
      REDIS__CONNECTIONSTRING: redis:6379,password=${REDIS_PASSWORD}
      # Where the accounts service publishes the keys its assertions verify with: the dashboard
      # serves only the operator X-Ziggurat-Assertion names, never the plain headers beside it.
      ACCOUNTS__JWKSURL: http://accounts:8080/accounts/internal/jwks
      # LemonadeChat__ApiUrl arrives through .env, as it does for the agent: the probe row for
      # the Lemonade chat host exists only when that line is set. A literal here would win over
      # .env and keep the probe off.
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - jackbot

  # Docker creates a missing bind-mount folder as root, and accounts runs as PUID, so on a fresh host
  # it could not create its store. This one-shot step, from the same image, hands ./volumes/accounts
  # to PUID:PGID and exits before the service starts; it is a no-op on every later start.
  accounts-volume:
    image: accounts:latest
    container_name: accounts-volume
    build:
      context: ${REPOSITORY_PATH}
      dockerfile: Accounts/Dockerfile
    user: "0:0"
    entrypoint: ["chown", "${PUID:-1654}:${PGID:-1654}", "/data"]
    volumes:
      - ./volumes/accounts:/data
    restart: "no"
    depends_on:
      base-sdk:
        condition: service_started

  # Households, people, passkeys, invites and sessions. Caddy routes /accounts/* on the main host
  # here (sign-in, enrollment) and asks /accounts/verify about every protected request; nothing
  # else reaches it. Its store is a SQLite file in this volume, backed up with the volume. The
  # operator's way in, before anyone can sign in and after losing every passkey:
  #   docker exec accounts dotnet Accounts.dll mint-link --operator --name "<display name>"
  # and a recovery link for anyone: docker exec accounts dotnet Accounts.dll mint-link --user <id>
  # It signs who a turn is for with a key it generates into this volume (signing/) on first start,
  # nothing to provision; rotate-signing-key and, once the old key's assertions have run out,
  # retire-signing-keys change it beside the running service. A household's own server opens its
  # tunnel with a credential minted here, printed once:
  #   docker exec accounts dotnet Accounts.dll mint-tunnel-credential --household <id> --server <name>
  # list-tunnel-credentials shows them without their secrets, and revoke-tunnel-credential --id <id>
  # revokes one and tells the relay, which closes its tunnel.
  accounts:
    image: accounts:latest
    logging:
      options:
        max-size: "5m"
        max-file: "3"
    container_name: accounts
    build:
      context: ${REPOSITORY_PATH}
      dockerfile: Accounts/Dockerfile
    restart: unless-stopped
    user: ${PUID:-1654}:${PGID:-1654}
    volumes:
      - ./volumes/accounts:/data
    environment:
      <<: *timezone
      # Per deployment, not secrets. A passkey belongs to the parent domain, so one signs in on every
      # host under it; the session cookie is set there for the same reason. The origins are the
      # hosts the Caddyfile serves people on: a ceremony's page must be on one, and sign-in returns
      # only to one. Links the operator's command prints start with the public base.
      WEBAUTHN__RELYINGPARTYID: herfluffness.com
      ALLOWEDORIGINS__0: https://assistants.herfluffness.com
      ALLOWEDORIGINS__1: https://sexy.herfluffness.com
      ALLOWEDORIGINS__2: https://sugary.herfluffness.com
      ALLOWEDORIGINS__3: https://assistants-dashboard.herfluffness.com
      SESSIONCOOKIE__DOMAIN: .herfluffness.com
      PUBLICBASEURL: https://assistants.herfluffness.com
      # The bot people link their Telegram through, the shared bot, without the @: the account page's
      # link code and an invite are shown as its t.me deep link. Left empty they are shown as a bare code to
      # send the bot as /start <code>, which is safe; a wrong name would send codes to a stranger's bot.
      TELEGRAM__BOTUSERNAME: ""
      # The servers that may ask whose account an identity is, each by the credential it already
      # holds for its own /mcp, so no secret exists for this alone. Caddy answers the internal API
      # 404 from outside. A household's voice server is no caller here: it asks on its tunnel's
      # accounts back-call, and is admitted by the live tunnel credential the relay shows for it.
      CALLERS__mcp-channel-signalr: ${MCP_SECRET_CHANNEL_SIGNALR}
      CALLERS__mcp-channel-telegram: ${MCP_SECRET_CHANNEL_TELEGRAM}
      # The shared servers that read their own section of the calling household's configuration —
      # Idealista its keys, scheduling and Sugary the household's zone — each by the credential it
      # already holds for its own /mcp, and each proving the household with what its call carries.
      CALLERS__mcp-idealista: ${MCP_SECRET_IDEALISTA}
      CALLERS__mcp-scheduling: ${MCP_SECRET_SCHEDULING}
      CALLERS__mcp-sugary: ${MCP_SECRET_SUGARY}
      # The household migration below, and only its household import: it can make the operator and
      # mint their link, so it is admitted by a secret of its own, left empty — nobody — but for the run.
      CALLERS__household-migration: ${HOUSEHOLD_MIGRATION_SECRET}
      # The agent, whose relay asks on every tunnel's open which household's server its credential
      # is, and nothing else. The agent has no /mcp of its own; the credential it already holds for
      # its own API is the one it asks with, so again no secret exists for this alone. SexyTime's
      # server holds that one too, which lets it ask about a tunnel credential only if it already
      # has one — and a credential opens a tunnel by itself.
      CALLERS__agent: ${AGENTAPI__SHAREDSECRET}
      # Where a revoked tunnel credential is announced, so the relay closes its tunnel at once, and a
      # saved household configuration, so every reader drops what it kept of that household.
      REDIS__CONNECTIONSTRING: redis:6379,password=${REDIS_PASSWORD}
      # The master key every household's data key is wrapped with, which seals that household's
      # secrets (its OpenRouter key, Idealista's keys, its Telegram bots). This service's alone.
      HOUSEHOLDCONFIG__MASTERKEY: ${HOUSEHOLD_CONFIG_MASTER_KEY}
      # Where the agent publishes the keys its call tokens verify with: a shared server proves which
      # household it asks about with the call token it was handed, and the agent proves it is the
      # agent with one of its own.
      AGENTKEYSURL: http://agent:8080/internal/jwks
      # Where the agent answers, for the operator's household list: its relay says which of a
      # household's own servers are connected, asked with CALLERS__agent above, the agent API's secret.
      AGENTURL: http://agent:8080
      # Where the dashboard's host answers, for an owner's usage page: its usage route is asked with an
      # assertion this service signs for the owner, which the host verifies against this service's keys
      # as it verifies everything, so no secret exists for this.
      OBSERVABILITYURL: http://observability:8080
    networks:
      - jackbot
    depends_on:
      accounts-volume:
        condition: service_completed_successfully
      base-sdk:
        condition: service_started
      redis:
        condition: service_healthy

  # One-shot, by hand, on the deploy that brings accounts: carries the retired identity map's people
  # into the home household as accounts, and what was filed under their names — memories, remembered
  # logins, phones, schedules' writers, topics, voice profiles, the Sugary log — onto their user ids;
  # seeds the home's configuration (settings, agents, features, the chat client's spaces, its keys);
  # and moves every shared store into the home household.
  # Under a profile, so `up` never starts it. Put the people in ./volumes/household-migration/people.json
  # and HOUSEHOLD_MIGRATION_SECRET in .env (then `docker compose up -d accounts`), and run
  #   ... | docker compose --profile migrate run --rm -T household-migration \
  #     --people /input/people.json --operator <name> --owner <name> --sugary <name> [--dry-run] \
  #     --home-keys -
  # piping in, never from a file in the volume, the home's keys as .env held them before households:
  # { "telegramBots": { "jack": { "token": BOTS__0 }, "jonas": { "token": BOTS__1 } },
  #   "idealista": { "apiKey": IDEALISTA__APIKEY, "secret": IDEALISTA__SECRET } }.
  # Running it again changes nothing. The steps are .scratch/tenants-config/deploy.md.
  household-migration:
    image: household-migration:latest
    profiles: ["migrate"]
    build:
      context: ${REPOSITORY_PATH}
      dockerfile: HouseholdMigration/Dockerfile
    restart: "no"
    # The owner of the Sugary and voices volumes it writes in, as their services run. The voice
    # profiles and the remembered logins are the ones the deployment kept before the home moved into
    # the tenant kit, which carries both over afterwards (TenantKit/README.md): it runs first.
    user: ${PUID:-1654}:${PGID:-1654}
    volumes:
      - ./volumes/household-migration:/input:ro
      - ./volumes/sugary:/sugary
      - ./volumes/voices:/voices
    environment:
      <<: *timezone
      REDISCONNECTIONSTRING: redis:6379,password=${REDIS_PASSWORD}
      ACCOUNTS__CREDENTIAL: ${HOUSEHOLD_MIGRATION_SECRET}
      # Opens each remembered login sealed under a person's name and seals it again under their user id.
      LOGINS__STATEKEY: ${LOGINS__STATEKEY}
    networks:
      - jackbot
    depends_on:
      base-sdk:
        condition: service_started
      redis:
        condition: service_healthy
      accounts:
        condition: service_started

  caddy:
    build:
      context: ./caddy
    logging:
      options:
        max-size: "5m"
        max-file: "3"
    container_name: caddy
    ports:
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - ./volumes/caddy_data:/data
      - ./volumes/caddy_config:/config
    environment:
      <<: *timezone
      CF_API_TOKEN: ${CF_API_TOKEN}
    restart: unless-stopped
    networks:
      - jackbot
    depends_on:
      - webui
      - agent
      - mcp-sugary
      - accounts

networks:
  jackbot:

volumes:
  chat-uploads:
