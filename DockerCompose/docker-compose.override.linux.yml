# Linux user secrets ($HOME/.microsoft/usersecrets), one project's directory per service: a container reads its own project's
# secrets and no other's. The id is the project's UserSecretsId; the agent and the dashboard
# share one. A project with no UserSecretsId reads none and mounts nothing.
services:
  mcp-library:
    volumes:
      - ${HOME}/.microsoft/usersecrets/75983515-6b41-4913-a021-553345dc21ba:/home/app/.microsoft/usersecrets/75983515-6b41-4913-a021-553345dc21ba:ro

  mcp-websearch:
    volumes:
      - ${HOME}/.microsoft/usersecrets/d8f3e2a1-5b7c-4d9e-8f1a-2c3b4d5e6f7a:/home/app/.microsoft/usersecrets/d8f3e2a1-5b7c-4d9e-8f1a-2c3b4d5e6f7a:ro

  mcp-idealista:
    volumes:
      - ${HOME}/.microsoft/usersecrets/e9f4a3b2-6c8d-4e5f-9a2b-3c4d5e6f7a8b:/home/app/.microsoft/usersecrets/e9f4a3b2-6c8d-4e5f-9a2b-3c4d5e6f7a8b:ro

  mcp-homeassistant:
    volumes:
      - ${HOME}/.microsoft/usersecrets/1ad2c5b9-7e4f-4a3b-9c8d-2f1e6a4b8c30:/home/app/.microsoft/usersecrets/1ad2c5b9-7e4f-4a3b-9c8d-2f1e6a4b8c30:ro

  mcp-channel-signalr:
    volumes:
      - ${HOME}/.microsoft/usersecrets/815bef94-3e37-472c-b151-24e5bc9821fd:/home/app/.microsoft/usersecrets/815bef94-3e37-472c-b151-24e5bc9821fd:ro

  mcp-channel-telegram:
