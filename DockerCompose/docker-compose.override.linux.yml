      - ${HOME}/.microsoft/usersecrets/ead7bc91-e201-4c21-be64-d50ecc783ad6:/home/app/.microsoft/usersecrets/ead7bc91-e201-4c21-be64-d50ecc783ad6:ro

  mcp-channel-voice:
    volumes:
      - ${HOME}/.microsoft/usersecrets/b2c5d8e1-9f44-4a72-9eaf-2c8f3d6b1a07:/home/app/.microsoft/usersecrets/b2c5d8e1-9f44-4a72-9eaf-2c8f3d6b1a07:ro

  agent:
    volumes:
      - ${HOME}/.microsoft/usersecrets/bae64127-c00e-4499-8325-0fb6b452133c:/home/app/.microsoft/usersecrets/bae64127-c00e-4499-8325-0fb6b452133c:ro

  webui:
    volumes:
