services:
  base-sdk:
    build:
      args:
        - BUILD_CONFIGURATION=Debug

  agent:
    build:
      args:
        - BUILD_CONFIGURATION=Debug
    environment:
      - DOTNET_ENVIRONMENT=Development
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    volumes:
      - vsdbg:/remote_debugger:ro

  webui:
    build:
      args:
        - BUILD_CONFIGURATION=Debug
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    volumes:
      - vsdbg:/remote_debugger:ro

  observability:
    build:
      args:
        - BUILD_CONFIGURATION=Debug
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    volumes:
      - vsdbg:/remote_debugger:ro

  mcp-library:
    build:
      args:
        - BUILD_CONFIGURATION=Debug
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    volumes:
      - vsdbg:/remote_debugger:ro

  mcp-vault:
    build:
      args:
        - BUILD_CONFIGURATION=Debug
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    volumes:
      - vsdbg:/remote_debugger:ro

  mcp-sandbox:
    build:
      args:
        - BUILD_CONFIGURATION=Debug
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    volumes:
      - vsdbg:/remote_debugger:ro

  mcp-websearch:
    build:
      args:
        - BUILD_CONFIGURATION=Debug
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    volumes:
      - vsdbg:/remote_debugger:ro

  mcp-idealista:
    build:
      args:
        - BUILD_CONFIGURATION=Debug
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    volumes:
      - vsdbg:/remote_debugger:ro

  mcp-homeassistant:
    build:
      args:
        - BUILD_CONFIGURATION=Debug
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    volumes:
      - vsdbg:/remote_debugger:ro

  mcp-channel-signalr:
    build:
      args:
        - BUILD_CONFIGURATION=Debug
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    volumes:
      - vsdbg:/remote_debugger:ro

  mcp-channel-telegram:
    build:
      args:
        - BUILD_CONFIGURATION=Debug
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    volumes:
      - vsdbg:/remote_debugger:ro

  mcp-channel-voice:
    build:
      args:
        - BUILD_CONFIGURATION=Debug
    # The hub dials each satellite's Wyoming server as a client; satellites running on
    # the Docker host (e.g. a WSL nabu-satellite) are reached via host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DOTNET_ENVIRONMENT=Development
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    volumes:
      - vsdbg:/remote_debugger:ro

  mcp-scheduling:
    build:
      args:
        - BUILD_CONFIGURATION=Debug
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    volumes:
      - vsdbg:/remote_debugger:ro

  mcp-printer:
    build:
      args:
        - BUILD_CONFIGURATION=Debug
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    volumes:
      - vsdbg:/remote_debugger:ro

  mcp-timers:
    build:
      args:
        - BUILD_CONFIGURATION=Debug
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    volumes:
      - vsdbg:/remote_debugger:ro

  vsdbg-install:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    volumes:
      - vsdbg:/vsdbg
    command: >
      bash -c "curl -sSL https://aka.ms/getvsdbgsh | bash /dev/stdin -v latest -l /vsdbg"
    profiles:
      - setup

volumes:
  vsdbg:
