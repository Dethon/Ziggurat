<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <meta content="light dark" name="color-scheme"/>
    <title>Herfluffness' Assistants</title>
    <base href="/"/>

    <!-- Self-hosted fonts: preload critical faces for first paint -->
    <link rel="preload" href="/fonts/hanken-grotesk-400.woff2" as="font" type="font/woff2" crossorigin/>
    <link rel="preload" href="/fonts/fraunces.woff2" as="font" type="font/woff2" crossorigin/>

    <link href="css/app.css" rel="stylesheet"/>
    <!-- With credentials: the page is behind the session check, and a browser fetches a manifest
         without cookies unless told to. -->
    <link rel="manifest" crossorigin="use-credentials"/>
    <link href="favicon.svg" rel="icon" type="image/svg+xml"/>

    <!-- Early theme initialization to prevent flash + per-space manifest -->
    <script>
        (function () {
            var theme = localStorage.getItem('theme');
            if (!theme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                theme = 'dark';
            }
            if (theme) {
                document.documentElement.setAttribute('data-theme', theme);
            }

            // An installed app's browser reads the manifest a launch links first, before the hub has
            // named the space, and swaps the app's icon and name for whatever that one says. So the
            // page links the space as it was last named here, and manifestHelper relinks it once the
            // hub has spoken.
            window.spaceManifest = {
                href: function (slug, name, color) {
                    var query = [];
                    if (slug && slug !== 'default') query.push('slug=' + encodeURIComponent(slug));
                    if (name) query.push('name=' + encodeURIComponent(name));
                    if (color && /^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$/.test(color)) {
                        query.push('color=' + encodeURIComponent(color));
                    }
                    return '/manifest.webmanifest' + (query.length ? '?' + query.join('&') : '');
                },
                remember: function (slug, name, color) {
                    try {
                        localStorage.setItem('space-manifest:' + (slug || 'default'),
                            JSON.stringify({ name: name, color: color }));
                    } catch (e) { }
                },
                recall: function (slug) {
                    try {
                        var known = JSON.parse(localStorage.getItem('space-manifest:' + (slug || 'default')));
                        return known && typeof known === 'object' ? known : {};
                    } catch (e) {
                        return {};
                    }
                }
            };

            var slug = location.pathname.split('/')[1] || '';
            var known = window.spaceManifest.recall(slug);
            document.querySelector('link[rel="manifest"]').href = window.spaceManifest.href(
                slug,
                typeof known.name === 'string' ? known.name : null,
                typeof known.color === 'string' ? known.color : null);
        })();
    </script>
</head>

<body>
<div id="app">
    <div class="loading-screen">
        <div class="spinner"></div>
        <p>Loading...</p>
    </div>
</div>

<div id="blazor-error-ui">
    An unhandled error has occurred.
    <a class="reload" href="">Reload</a>
    <a class="dismiss">Dismiss</a>
</div>
<script src="push-notifications.js"></script>
<script src="_framework/blazor.webassembly.js"></script>
<script src="app.js"></script>
<script src="dictation.js"></script>
<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('service-worker.js');
    }
</script>
</body>

</html>
