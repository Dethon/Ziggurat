<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <meta content="light dark" name="color-scheme"/>
    <title>Herfluffness' Assistants</title>
    <base href="/"/>

    <!-- Self-hosted fonts: preload critical faces for first paint -->
    <link rel="preload" href="/fonts/hanken-grotesk-400.woff2" as="font" type="font/woff2" crossorigin/>
    <link rel="preload" href="/fonts/fraunces.woff2" as="font" type="font/woff2" crossorigin/>

    <link href="css/app.css" rel="stylesheet"/>
    <link rel="manifest"/>
    <link href="favicon.svg" rel="icon" type="image/svg+xml"/>

    <!-- Early theme initialization to prevent flash + per-space manifest -->
    <script>
        (function () {
            var theme = localStorage.getItem('theme');
            if (!theme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                theme = 'dark';
            }
            if (theme) {
                document.documentElement.setAttribute('data-theme', theme);
            }

            var slug = location.pathname.split('/')[1] || '';
            var manifestUrl = '/manifest.webmanifest' + (slug ? '?slug=' + encodeURIComponent(slug) : '');
            document.querySelector('link[rel="manifest"]').href = manifestUrl;
        })();
    </script>
</head>

<body>
<div id="app">
    <div class="loading-screen">
        <div class="spinner"></div>
        <p>Loading...</p>
    </div>
</div>

<div id="blazor-error-ui">
    An unhandled error has occurred.
    <a class="reload" href="">Reload</a>
    <a class="dismiss">Dismiss</a>
</div>
<script src="push-notifications.js"></script>
<script src="_framework/blazor.webassembly.js"></script>
<script src="app.js"></script>
<script src="dictation.js"></script>
<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('service-worker.js');
    }
</script>
</body>

</html>
